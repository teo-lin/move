name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Decode signing key
        if: ${{ secrets.MOVE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.move"
          echo "${{ secrets.MOVE_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.move/move-release.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$HOME/.move/move-release.jks
          storePassword=${{ secrets.MOVE_STORE_PASSWORD }}
          keyAlias=${{ secrets.MOVE_KEY_ALIAS }}
          keyPassword=${{ secrets.MOVE_KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Name APK
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/release/app-release.apk "move-${VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: move-apk
          path: move-*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Move private Android APK"
          gh release upload "$GITHUB_REF_NAME" move-*.apk --clobber
